name: Weekly Release Notes
on:
  schedule:
    # Domingo às 08:00 BRT (11:00 UTC)
    - cron: '0 11 * * 0'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    name: Create Weekly Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag and check for changes
        id: check_changes
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            echo "No baseline tag found. A manual tag needs to be created first."
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          COMMITS=$(git log $LAST_TAG..HEAD --oneline)
          if [ -z "$COMMITS" ]; then
            echo "No changes found since $LAST_TAG. Skipping release creation."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected since $LAST_TAG. Proceeding."
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Compile LaTeX Paper
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper

      - name: Generate new tag name
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          NEW_TAG="v$(date +'%Y.%m.%d')"
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV

      - name: Create Zip Archives
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          zip -r project.zip . -x "docs/*" "paper/*" ".github/*" ".git/*"
          zip -r paper.zip paper/

      - name: Create GitHub Release
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$NEW_TAG" \
            --title "Release $NEW_TAG" \
            --generate-notes \
            --target main \
            project.zip \
            paper.zip \
            paper/main.pdf
